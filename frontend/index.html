<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhatWeWatch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="app-header">
  <h1 class="app-header__brand">ЧТОСМОТРИМ</h1>

  <form class="search-bar" id="search-form">
    <input
      type="search"
      id="search-input"
      class="search-bar__input"
      placeholder="Search a title…"
      autocomplete="off"
    />

    <button
      type="submit"
      class="search-bar__button"
    >
      Search
    </button>
  </form>

  <button
    type="button"
    class="account-button"
    id="account-button"
  >
    Войти
  </button>
</header>


    
<nav class="type-filters" id="type-filters">
    
  <button class="type-filter" data-type="movie">
    <span class="type-dot type-dot--movie"></span>
    Фильмы
  </button>

  <button class="type-filter" data-type="series">
    <span class="type-dot type-dot--series"></span>
    Сериалы
  </button>

  <button class="type-filter" data-type="anime">
    <span class="type-dot type-dot--anime"></span>
    Аниме
  </button>

  <button class="type-filter" data-type="game">
    <span class="type-dot type-dot--game"></span>
    Игры
  </button>

</nav>


  <main class="app-main">

    <section class="results-section" id="results-section" hidden>
      <div class="section-header">
        <h2>Search results</h2>
        <button type="button" class="text-button" id="clear-search">Back to library</button>
      </div>
      <div class="card-grid" id="results-grid"></div>
    </section>

    <section class="library-section" id="library-section">
      <div class="section-header">
        <h2>My library</h2>
      </div>
      <div class="card-grid" id="library-grid"></div>
    </section>

  </main>

  <div class="modal-overlay" id="modal-overlay" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Title details"></div>
  </div>

  <div class="loading-overlay" id="loading-overlay" hidden>
  <div class="loading-box">
    <div class="loading-spinner"></div>

    <h3 class="loading-title">Ищем медиа…</h3>

    <p class="loading-text" id="loading-text">
      Подбираем результаты из всех доступных баз данных
    </p>
  </div>
</div>


<!-- Authentication modal -->

<div
  class="auth-overlay"
  id="auth-overlay"
  hidden
>
  <div
    class="auth-modal"
    role="dialog"
    aria-modal="true"
    aria-label="Authentication"
  >

    <h2 id="auth-title">Вход</h2>

    <form id="auth-form">



<label>
  Email

  <input
    type="email"
    id="auth-email"
    autocomplete="email"
    required
  />
</label>

      <label>
        Пароль
        <input
          type="password"
          id="auth-password"
          autocomplete="current-password"
          required
        />
      </label>

<label
  id="auth-password-confirm-field"
  hidden
>
  Повторите пароль

  <input
    type="password"
    id="auth-password-confirm"
    autocomplete="new-password"
  />
</label>

      <p
        class="auth-error"
        id="auth-error"
        hidden
      ></p>

      <button
        type="submit"
        class="button button--primary"
        id="auth-submit"
      >
        Войти
      </button>

    </form>

    <div class="auth-switch">
      <span id="auth-switch-text">
        Нет аккаунта?
      </span>

      <button
        type="button"
        class="text-button"
        id="auth-switch"
      >
        Зарегистрироваться
      </button>
    </div>

  </div>
</div>


<!-- Account modal -->

<div
  class="auth-overlay"
  id="auth-modal"
  hidden
>
  <div
    class="auth-modal"
    role="dialog"
    aria-modal="true"
    aria-label="Account"
  >

    <h2>Аккаунт</h2>

    <p class="account-email">
      <span id="account-email"></span>
    </p>

    <button
      type="button"
      class="button button--danger"
      id="account-logout"
    >
      Выйти
    </button>

  </div>
</div>

  <footer class="app-footer">
    <p>WhatWeWatch — a personal media library</p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
